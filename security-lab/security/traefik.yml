entryPoints:
  websecure:
    address: ":443"

providers:
  docker:
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

api:
  dashboard: true

log:
  level: INFO

tls:
  certificates:
    - certFile: "/certs/rest-service.crt"
      keyFile: "/certs/rest-service.key"
  stores:
    default:
      defaultCertificate:
        certFile: "/certs/rest-service.crt"
        keyFile: "/certs/rest-service.key"
