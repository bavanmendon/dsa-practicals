#version: "3.9"

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command: start-dev --import-realm
    environment:
      KC_DB: dev-mem
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
    volumes:
      - ./security/keycloak/realm-export.json:/opt/keycloak/data/import/dsa-lab-realm.json:ro
    ports:
      - "8081:8080"
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`keycloak`)"
      - "traefik.http.routers.keycloak.entrypoints=websecure"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      - "traefik.docker.network=security-lab_app-network"

  gateway:
    image: traefik:v3.6.1
    restart: always
    command:
      - --entryPoints.websecure.address=:443
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --log.level=DEBUG                                           #INFO
      - --api.dashboard=true
    environment:
      - DOCKER_API_VERSION=1.44
    ports:
      - "443:443"
      - "8080:8080"
    volumes:
      - ./security/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./security/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./security/certs:/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network
#      - security-lab_default
    labels:
      - "traefik.docker.network=security-lab_app-network"

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  grpc-service:
    build: ./grpc-service
    container_name: grpc-service
    depends_on:
      - mongodb
    environment:
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_DB: itemsdb
    ports:
      - "50051:50051"
      - "9103:9103"
    volumes:
      - ./security/certs:/certs:ro
    networks:
      - app-network

  rest-service:
    build: ./rest-service
    container_name: rest-service
    depends_on:
      - grpc-service
    environment:
      GRPC_HOST: grpc-service
      GRPC_PORT: 50051
    ports:
      - "5000:5000"
    volumes:
      - ./security/certs:/certs:ro
    networks:
      - app-network
 #     - security-lab_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rest.rule=Host(`localhost`) && PathPrefix(`/api`)"
      - "traefik.docker.network=security-lab_app-network"
      - "traefik.http.routers.rest.entrypoints=websecure"
      - "traefik.http.routers.rest.tls=true"
      - "traefik.http.routers.rest.middlewares=rest-strip@docker"
      - "traefik.http.middlewares.rest-strip.stripprefix.prefixes=/api"
      - "traefik.http.services.rest.loadbalancer.server.port=5000"
      - "traefik.http.routers.rest.tls.domains[0].main=localhost"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - app-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana-provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - app-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - app-network

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "14250:14250"
      - "14268:14268"
      - "43177:4317"
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
